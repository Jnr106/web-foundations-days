<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
  </head>

  <body>
    <header>
      <h1>User Directory</h1>
      <p>Load users from an API and filter them by name.</p>
    </header>

    <main>
      <button type="button" id="load-users">Load users</button>

      <p>
        <label for="filter-input">Filter users by name</label>
        <input
          type="search"
          id="filter-input"
          placeholder="Type a name..."
        >
      </p>

      <p id="status" role="status" aria-live="polite"></p>
      <ul id="users-list"></ul>
    </main>
  </body>
</html>
